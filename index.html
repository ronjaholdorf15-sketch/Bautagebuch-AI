<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IT-KOM Bautagebuch</title>
    <!-- Polyfill for 'process' to prevent crashes in libraries expecting Node.js env -->
    <script>
      window.process = {
        env: {
          NODE_ENV: 'production'
        }
      };
      
      // Global Error Handler: If App crashes before React mounts, show error on screen
      window.onerror = function(message, source, lineno, colno, error) {
        const errorContainer = document.getElementById('error-container');
        if (errorContainer) {
            errorContainer.style.display = 'block';
            document.getElementById('error-message').innerText = 
                "Fehler beim Starten:\n" + message + "\n" + (error ? error.stack : '');
            document.getElementById('loading-spinner').style.display = 'none';
        }
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#eff6ff',
                100: '#dbeafe',
                200: '#bfdbfe',
                300: '#93c5fd',
                400: '#60a5fa',
                500: '#3b82f6',
                600: '#1B3E78',
                700: '#1d4ed8',
                800: '#1e40af',
                900: '#1e3a8a',
                primary: '#1B3E78', // IT-KOM Blue
                accent: '#3abccb',  // IT-KOM Cyan
              }
            },
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'sans-serif'],
              mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'monospace'],
            },
            boxShadow: {
              'soft': '0 2px 15px -3px rgba(0, 0, 0, 0.07), 0 4px 6px -2px rgba(0, 0, 0, 0.05)',
              'premium': '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)',
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap');
      
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
      
      body {
        background-color: #f8fafc;
        color: #0f172a;
      }

      .glass {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }

      .input-focus {
        transition: all 0.2s ease;
      }
      .input-focus:focus {
        background: #fff;
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        border-color: #2563eb;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fadeIn 0.4s ease-out forwards;
      }

      #error-container { display: none; padding: 20px; background: #fee2e2; color: #b91c1c; font-family: monospace; white-space: pre-wrap; margin: 20px; border-radius: 12px; border: 1px solid #fca5a5; }
    </style>
</head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased">
    
    <!-- Error Container -->
    <div id="error-container">
        <h3 style="font-weight: bold; margin-bottom: 10px;">Ein kritischer Fehler ist aufgetreten:</h3>
        <div id="error-message"></div>
    </div>

    <div id="root">
      <!-- Loading UI -->
      <div id="loading-spinner" style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #f8fafc;">
        
        <!-- Logo Container -->
        <div id="loading-logo-wrapper" style="width: 360px; margin-bottom: 24px; display: flex; justify-content: center; align-items: center;">
           <!-- Default Logo (Fix im Code) -->
           <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 240" width="1050" height="240" preserveAspectRatio="xMidYMid meet" style="width: 100%; height: auto;">
            <defs>
              <style>
                .font-brand { font-family: 'Arial Black', Arial, sans-serif; font-weight: 900; font-style: italic; }
                .font-sub { font-family: Arial, Helvetica, sans-serif; font-weight: bold; font-style: italic; }
              </style>
            </defs>
            <g transform="translate(10, 0)">
              <path d="M 40 45 C 180 15, 380 35, 520 38 L 520 40 C 380 38, 180 20, 40 52 Z" fill="#29B6D1" />
              <circle cx="360" cy="35" r="5" fill="#29B6D1" />
              <circle cx="450" cy="38" r="3" fill="#29B6D1" />
              <circle cx="520" cy="39" r="2" fill="#29B6D1" />
              <path d="M 30 95 C 200 55, 450 70, 600 70 L 600 73 C 450 74, 200 60, 30 105 Z" fill="#1D71B8" />
              <circle cx="430" cy="73" r="11" fill="#1D71B8" />
              <circle cx="530" cy="71" r="6" fill="#1D71B8" />
              <circle cx="600" cy="71" r="3" fill="#1D71B8" />
              <path d="M 20 150 C 220 100, 500 110, 720 100 L 720 103 C 500 114, 220 108, 20 162 Z" fill="#133368" />
              <circle cx="515" cy="113" r="14" fill="#133368" /> 
              <circle cx="630" cy="106" r="7" fill="#133368" />
              <circle cx="720" cy="101" r="3" fill="#133368" />
            </g>
            <g transform="translate(140, 0)">
              <text x="890" y="55" class="font-sub" font-size="30" fill="#29B6D1" text-anchor="end">Glasfaser</text>
              <text x="890" y="92" class="font-sub" font-size="30" fill="#1D71B8" text-anchor="end">Schnelligkeit</text>
              <text x="890" y="128" class="font-sub" font-size="30" fill="#133368" text-anchor="end">Zuverlässigkeit</text>
            </g>
            <g transform="translate(40, 0)">
              <text x="480" y="195" class="font-brand" font-size="125" fill="#133368" text-anchor="end">IT</text>
              <rect x="520" y="155" width="60" height="18" fill="#133368" />
              <text x="610" y="195" class="font-brand" font-size="125" fill="#133368">KOM</text>
            </g>
            <text x="25" y="235" class="font-brand" font-size="26" fill="#133368" letter-spacing="9.5">TELEKOMMUNIKATIONSTECHNIK GMBH</text>
          </svg>
        </div>
        
        <div style="display: flex; align-items: center; gap: 10px; color: #64748b; margin-top: 8px;">
            <svg class="animate-spin" style="width: 20px; height: 20px; color: #1B3E78;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle style="opacity: 0.25;" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path style="opacity: 0.75;" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span style="font-family: sans-serif;">Bautagebuch wird geladen...</span>
        </div>
      </div>
    </div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
